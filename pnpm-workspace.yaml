# pnpm 11 security defaults (explicit so global ~/.config/pnpm/rc cannot drift).
minimumReleaseAge: 1440
nodeLinker: isolated

allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

peerDependencyRules:
  allowedVersions:
    eslint: '10'
    react: '19'

overrides:
  # All @sentry packages must share one release line: @sentry/electron 7.20.0
  # declares @sentry/core 10.75.0 exactly, so the override moves with it.
  # @sentry/electron is pinned exactly in package.json: a caret range let a
  # dedupe take 7.20.0 (@sentry/node 10.75) under a 10.74 core override.
  '@sentry/core': 10.75.0
  # GHSA-vwc7-r8mq-g2x9 (CVE-2026-76845, symlink-following extraction): the
  # resolved version stays INSIDE the vulnerable 0.5.9–0.6.0 range because
  # no patched release exists upstream — this override tracks compatibility
  # only and is NOT a fix.
  adm-zip: '>=0.6.0'
  sharp: '>=0.35.3'
  nanoid: '>=3.3.18'
  # GHSA-5jgf-p345-68v8 + GHSA-f65p-4m7j-42xc (high): SSRF/host-confusion in
  # fast-uri <3.1.6, pulled in via ajv (@modelcontextprotocol/sdk, app-builder-lib).
  fast-uri: '>=3.1.6'
  # Security patches: decode-uri-component >=0.5.0, @xmldom/xmldom >=0.8.15,
  # qs >=6.16.0 (moderate audit findings); all releases >=24h old at edit time.
  # @xmldom/xmldom is pinned to the exact patched 0.8 release: the >= range
  # resolved 0.9.12, whose DOMParser API breaks plist@3.1.0 (declares ^0.8.8)
  # and crashes electron-builder mac packaging ("mimeType undefined").
  decode-uri-component: '>=0.5.0'
  '@xmldom/xmldom': '0.8.15'
  qs: '>=6.16.0'
  # GHSA-w27v-7q3p-w38r (high): SVGO removeScripts bypass; astro pulls
  # svgo ^4.0.2, patched in 4.1.0 (2026-08-24, >24h old).
  svgo: '>=4.1.0'
  # GHSA-2wm5-q62r-hmrv (moderate, CWE-1333): slow rejection of oversized
  # malformed color strings in colord <2.9.4. Dev-only and build-time - reached
  # via the icon toolkit (@lobehub/icons > @lobehub/ui > leva), which parses our
  # own brand colours, never untrusted input. leva declares ^2.9.2, so the
  # resolved 2.10.0 stays INSIDE its range (unlike the @xmldom/xmldom case
  # above) and colord's export map is unchanged from 2.9.3. Patched in 2.9.4
  # (2026-08-19); every 2.9.4+ release is ~1 month old, past minimumReleaseAge.
  colord: '>=2.9.4'
  # GHSA-r5fr-rjxr-66jc (high): code injection through `_.template` import key
  # names in lodash-es <=4.17.23. mermaid 12 pins chevrotain ~11.1, which pins
  # lodash-es 4.17.23 exactly; nothing here calls `_.template` with untrusted
  # keys, but the audit gate is high. 4.18.1 (2026-04-01) is a minor within
  # 4.x, so the same API.
  lodash-es: '>=4.18.1'
  # GHSA-rfgv-xxqx-mfg5 (high, 2026-09-29): DoS via an unrequested WebSocket
  # subprotocol in undici 6.7.0-6.28.0. Build-time only - node-gyp under
  # electron-builder's @electron/rebuild, which never opens a WebSocket. Scoped
  # to the 6.x line so the 7.x and 8.x copies (already patched) stay put;
  # 6.28.1 (2026-09-04) is past minimumReleaseAge.
  'undici@>=6.7.0 <6.28.1': '^6.28.1'
  # GHSA-qhr7-859c-m2p7 and its parseCommaParts sibling (high, 2026-09): DoS by
  # uncontrolled recursion in brace-expansion. Build tooling only - minimatch
  # under electron-builder, @electron/asar and eslint, which expands our own
  # globs, never input an outsider controls - but the audit gate is high. One
  # range per major line in the lockfile (1.x, 2.x, 5.x), each moved to the
  # first release patched against both advisories and so the same API:
  # 1.1.20, 2.1.6 and 5.0.11 were all published 2026-09-14, past
  # minimumReleaseAge.
  'brace-expansion@<1.1.20': '^1.1.20'
  'brace-expansion@>=2.0.0 <2.1.6': '^2.1.6'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
