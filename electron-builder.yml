appId: com.vyotiq.agent
productName: Vyotiq
icon: resources/icon.png
# vyotiq:// deep links: NSIS writes the registry handler on Windows; macOS gets
# CFBundleURLTypes. Linux uses linux.mimeTypes below (deb/rpm .desktop entry).
protocols:
  - name: Vyotiq Deep Link
    schemes:
      - vyotiq
directories:
  buildResources: build
  output: dist-package
asar: true
compression: maximum
# Electron fuses, flipped in the packaged binary. Without them the installed
# app could be started with a --inspect debugger, as plain Node
# (ELECTRON_RUN_AS_NODE), with code injected through NODE_OPTIONS, or run an
# edited app.asar. grantFileProtocolExtraPrivileges stays on because the
# renderer loads from file://. resetAdHocDarwinSignature re-signs an unsigned
# macOS arm64 build, which flipping a fuse would otherwise leave unlaunchable.
#
# Two of these broke the packaged app until their causes were fixed in code
# (measured on Electron 44 with node-pty 1.1.0). Keep both fixes when touching
# either fuse, and re-check on a packaged build: a plain launch passes either way.
#  - runAsNode off: child_process.fork throws. node-pty's Windows kill() forks
#    a console-list helper and the rejection ended the app when a terminal
#    closed. src/main/app/conptyKill.ts replaces that helper; pipeErrors.ts
#    excuses the refusal if a node-pty upgrade moves it. Anything new that
#    needs a Node child uses utilityProcess, never fork or ELECTRON_RUN_AS_NODE.
#  - enableNodeOptionsEnvironmentVariable off: Electron also strips
#    NODE_EXTRA_CA_CERTS. src/main/net/caCertificates.ts loads the OS store
#    and recovers the variable (Windows registry), or every provider call
#    behind a proxy that re-signs TLS fails UNABLE_TO_VERIFY_LEAF_SIGNATURE.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
files:
  # Every matcher that copies app files must carry the FULL exclusion list:
  # a matcher left ignore-only gets `**/*` prepended by AppFileWalker and its
  # file set unions with the others, re-including excluded trees. Platform
  # `files` sets below therefore repeat these app exclusions before their
  # native trims. The leading positive pattern is required too.
  - '**/*'
  - '!**/.vscode/*'
  # Agent worktrees under .claude/ each carry a full node_modules (269K files
  # across two, observed 2026-09-22): '**/*' swept them into app.asar, taking it
  # from 76 MB to 1.2 GB and a `--win dir` build past 40 min. Nothing under
  # .claude/ is read at runtime — launch.json and settings.local.json are dev-only.
  - '!.claude/**'
  # Repo-root scratch from prior sessions: '**/*' swept it into app.asar the
  # same way it swept .claude/. Nothing here is read at runtime — output/ holds
  # ~1,850 generated frames/assets/videos, .playwright-mcp/ holds page snapshots,
  # and file-list-all.txt / replay-report.json are one-off verification dumps.
  # Excluded (not deleted): the data stays on disk, out of git and out of the pack.
  - '!{output,.playwright-mcp}/**'
  - '!{file-list-all.txt,replay-report.json}'
  # Dev-only state at the repo root: agent/editor config (.vyotiq, .cursor),
  # scratch builds (.tmp), test output, release-note drafts, one-off _*.diff
  # dumps and dev configs. None is read at runtime. The last line repeats
  # electron-builder's own default exclusions, which it adds to this list only
  # — the platform sets below need them spelled out.
  - '!{.vyotiq,.cursor,.tmp,coverage,test-results,release-notes,bin}/**'
  - '!{_*.diff,.cursorrules,.mcp.json,vitest.config.ts,pnpm-workspace.yaml,tsconfig.*.json}'
  - '!{electron-builder.yml,.gitignore,.gitattributes,.editorconfig}'
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  - '!site/**'
  - '!scripts/**'
  - '!audit/**'
  - '!remediation/**'
  - '!tmp-os-evidence/**'
  - '!dist-*/**'
  - '!resources/branding/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.{md,map}'
  # Drop dev-only weight from asar-packed node_modules (never loaded at runtime).
  - '!**/node_modules/**/{test,tests,__tests__,doc,docs,examples}/**'
  - '!**/node_modules/**/*.md'
  - '!**/node_modules/**/*.map'
  # onnxruntime-web (~107 MB packed): never loaded at runtime. No src import;
  # every @huggingface/transformers call site (dictation/local.ts,
  # dictation/whisperUtility.ts) runs in the Electron main process /
  # utilityProcess, where transformers.js resolves its onnxruntime-node backend.
  - '!**/node_modules/onnxruntime-web/**'
  # gpt-tokenizer: only TypeScript src/ and tests are dead weight. Every other
  # tree ships — modelParams.js statically requires ALL encodingParams/*.js
  # (including o200k_harmony), and each encoding module pulls its bpeRanks data,
  # so trimming "unused" encodings breaks startup in an installed build with
  # "Cannot find module ./encodingParams/o200k_harmony.js".
  - '!**/node_modules/gpt-tokenizer/{src,tests}/**'
  # node-pty build-only sources (winpty/conpty sources; runtime loads
  # prebuilds/* via lib/utils.js, prebuild.js short-circuits node-gyp).
  - '!**/node_modules/node-pty/{third_party,deps,src}/**'
  # cmake-js: native build tool only (prebuilt binaries ship per platform).
  - '!**/node_modules/cmake-js/**'
  # @sentry/react is bundled into out/renderer by vite (externalizeDeps:false);
  # main requires only @sentry/electron/main (logging/sentry.ts:2) — the
  # node_modules copy is never require()d at runtime. @sentry/browser STAYS
  # (hard dependency of @sentry/electron).
  - '!**/node_modules/@sentry/react/**'
extraResources:
  - from: resources/harness
    to: harness
    filter:
      - '**/*'
  - from: resources/marketplace
    to: marketplace
asarUnpack:
  # Runtime only reads icons from app.asar.unpacked (window.ts:39,
  # notifications/service.ts:99 — both fall back to the asar copy).
  # harness/marketplace resolve via process.resourcesPath
  # (extraResources), so unpacking resources/** only duplicated ~13 MB.
  - 'resources/icon.*'
  # Native addons cannot load from asar. Unpack .node files and ORT shared libs
  # (dll/so/dylib sit beside the binding). pnpm nests under .pnpm — use ** globs.
  # Do not unpack @huggingface/transformers (JS/WASM only; no .node).
  - '**/*.node'
  - '**/node_modules/onnxruntime-node/bin/**'
win:
  icon: resources/icon.ico
  target:
    - nsis
  # publisherName enables NSIS updater signature verification: electron-updater
  # compares the downloaded installer's Authenticode subject against it and
  # throws ERR_UPDATER_INVALID_SIGNATURE when they do not match. It MUST stay
  # unset while release builds are unsigned (release.yml falls back to unsigned
  # packs when CSC_LINK is unset) or Windows auto-update always fails. Re-add
  # `publisherName: <cert subject CN>` together with win.forceCodeSigning: true
  # once the signing cert is always present in the release environment.
  # Each Windows package keeps only its own arch's natives: `${arch}` is the
  # arch being packed (x64 or arm64) and `!(…)` matches every other one, so
  # the x64 app drops the arm64 onnxruntime and node-pty builds and the arm64
  # app drops the x64 ones (~150 MB of onnxruntime alone).
  files:
    # App exclusions repeat here — see the `files:` comment above.
    - from: .
      filter:
        - '!**/.vscode/*'
        - '!.claude/**'
        # Repo-root scratch: same reason as the top-level `files:` list.
        - '!{output,.playwright-mcp}/**'
        - '!{file-list-all.txt,replay-report.json}'
        - '!{.vyotiq,.cursor,.tmp,coverage,test-results,release-notes,bin}/**'
        - '!{_*.diff,.cursorrules,.mcp.json,vitest.config.ts,pnpm-workspace.yaml,tsconfig.*.json}'
        - '!{electron-builder.yml,.gitignore,.gitattributes,.editorconfig}'
        - '!src/**'
        - '!tests/**'
        - '!docs/**'
        - '!site/**'
        - '!scripts/**'
        - '!audit/**'
        - '!remediation/**'
        - '!tmp-os-evidence/**'
        - '!dist-*/**'
        - '!resources/branding/**'
        - '!electron.vite.config.{js,ts,mjs,cjs}'
        - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
        - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
        - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
        - '!**/*.{md,map}'
        - '!build{,/**/*}'
        - '!{.git,.github,.cursor,.vyotiq}/**'
        - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
        - '!**/onnxruntime-node/bin/napi-v6/linux/**'
        - '!**/onnxruntime-node/bin/napi-v6/win32/!(${arch})/**'
        # node-pty: keep this arch's win32 prebuild only.
        - '!**/node_modules/node-pty/prebuilds/{darwin,linux}*/**'
        - '!**/node_modules/node-pty/prebuilds/win32-!(${arch})/**'
  executableName: Vyotiq
  # Run by the uninstaller from resources/uninstall (see nsis.include).
  extraResources:
    - from: build/uninstall
      to: uninstall
    # The `vyotiq` command. Settings puts resources/cli on the user PATH; the
    # uninstaller takes it off (path-entry.ps1).
    - from: build/cli
      to: cli
nsis:
  # One installer per arch, not one carrying both: release.yml packs x64 and
  # arm64 in one run, and latest.yml then lists both installers. The updater
  # takes the one whose name holds its own arch (electron-updater findFile),
  # so the name must carry `${arch}`.
  buildUniversalInstaller: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Vyotiq is the company, Agent V the product. productName stays "Vyotiq":
  # it names %APPDATA%\Vyotiq, the .exe and the update feed's files, and
  # changing it would orphan every install's data. What a person reads in the
  # Start menu, on the desktop, in toasts and in Installed apps is the product.
  # An upgrade renames the old "Vyotiq" shortcuts: the installer reads the
  # previous ShortcutName from its registry key (setLinkVars in common.nsh).
  shortcutName: Agent V
  uninstallDisplayName: Agent V
  # Uninstalling deletes the per-user app data dir (%APPDATA%\Vyotiq) instead
  # of leaving stale profiles/configs behind forever. There is no checkbox: the
  # template deletes it unless the uninstaller runs for an update.
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  # customUnInstall puts back the Windows sandbox's integrity labels
  # (build/uninstall/restore-sandbox-labels.ps1, shipped by win.extraResources).
  include: build/installer.nsh
mac:
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Vyotiq uses the microphone for voice dictation.
  notarize: false
  files:
    # App exclusions repeat here — see the `files:` comment above.
    - from: .
      filter:
        - '!**/.vscode/*'
        - '!.claude/**'
        # Repo-root scratch: same reason as the top-level `files:` list.
        - '!{output,.playwright-mcp}/**'
        - '!{file-list-all.txt,replay-report.json}'
        - '!{.vyotiq,.cursor,.tmp,coverage,test-results,release-notes,bin}/**'
        - '!{_*.diff,.cursorrules,.mcp.json,vitest.config.ts,pnpm-workspace.yaml,tsconfig.*.json}'
        - '!{electron-builder.yml,.gitignore,.gitattributes,.editorconfig}'
        - '!src/**'
        - '!tests/**'
        - '!docs/**'
        - '!site/**'
        - '!scripts/**'
        - '!audit/**'
        - '!remediation/**'
        - '!tmp-os-evidence/**'
        - '!dist-*/**'
        - '!resources/branding/**'
        - '!electron.vite.config.{js,ts,mjs,cjs}'
        - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
        - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
        - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
        - '!**/*.{md,map}'
        - '!build{,/**/*}'
        - '!{.git,.github,.cursor,.vyotiq}/**'
        - '!**/onnxruntime-node/bin/napi-v6/linux/**'
        - '!**/onnxruntime-node/bin/napi-v6/win32/**'
        # node-pty: keep darwin prebuilds only (platform-wrong).
        - '!**/node_modules/node-pty/prebuilds/{win32,linux}*/**'
dmg:
  # ${arch} keeps arm64/x64 DMGs from colliding: both are uploaded to the same
  # GitHub release by the single macOS job in release.yml, and latest-mac.yml
  # must reference distinct files per arch (MacUpdater picks by URL).
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    # AppImage stays the primary target: only it carries electron-updater
    # auto-update metadata (latest-linux.yml points at the AppImage). deb and
    # rpm are install-path conveniences and update through the package
    # manager instead.
    - AppImage
    - deb
    - rpm
  # deb/rpm require RFC822 maintainer syntax "Name <email>"; package.json
  # author ("Vyotiq") has no email, and a bare-domain value would make fpm
  # fail. fpm accepts any string, so this still produces a buildable .deb.
  maintainer: "Vyotiq <support@vyotiq.com>"
  category: Development
  # The launcher's label; the binary and install path keep productName.
  desktop:
    entry:
      Name: Agent V
  # x-scheme-handler entry so deb/rpm installs resolve vyotiq:// links via xdg.
  mimeTypes:
    - x-scheme-handler/vyotiq
  # Same master PNG the other platforms use; stated explicitly because the
  # deb target renders the 512x512 hicolor slot from it.
  icon: resources/icon.png
  files:
    # App exclusions repeat here — see the `files:` comment above.
    - from: .
      filter:
        - '!**/.vscode/*'
        - '!.claude/**'
        # Repo-root scratch: same reason as the top-level `files:` list.
        - '!{output,.playwright-mcp}/**'
        - '!{file-list-all.txt,replay-report.json}'
        - '!{.vyotiq,.cursor,.tmp,coverage,test-results,release-notes,bin}/**'
        - '!{_*.diff,.cursorrules,.mcp.json,vitest.config.ts,pnpm-workspace.yaml,tsconfig.*.json}'
        - '!{electron-builder.yml,.gitignore,.gitattributes,.editorconfig}'
        - '!src/**'
        - '!tests/**'
        - '!docs/**'
        - '!site/**'
        - '!scripts/**'
        - '!audit/**'
        - '!remediation/**'
        - '!tmp-os-evidence/**'
        - '!dist-*/**'
        - '!resources/branding/**'
        - '!electron.vite.config.{js,ts,mjs,cjs}'
        - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
        - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
        - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
        - '!**/*.{md,map}'
        - '!build{,/**/*}'
        - '!{.git,.github,.cursor,.vyotiq}/**'
        - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
        - '!**/onnxruntime-node/bin/napi-v6/win32/**'
        # This arch's linux onnxruntime only (x64 or arm64).
        - '!**/onnxruntime-node/bin/napi-v6/linux/!(${arch})/**'
        # node-pty: keep linux prebuilds only (platform-wrong).
        - '!**/node_modules/node-pty/prebuilds/{win32,darwin}*/**'
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false

publish:
  provider: github
  owner: vyotiqai
  repo: vyotiq-agent-v-releases
  # Draft-first: release.yml pre-creates the draft, electron-builder uploads
  # into the existing draft (GitHubPublisher reuses any release whose
  # tag_name matches this tag), and finalize-release publishes it only after
  # every asset check passes. If electron-builder ever creates the release
  # itself (fallback path), it creates a draft too — nothing goes public
  # half-uploaded.
  releaseType: draft
