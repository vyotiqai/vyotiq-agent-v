# Deploys the landing site (landing/, https://vyotiq.com) to Cloudflare Pages.
# The deploy step is secret-gated: when CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID are not configured, the job still exits green and
# only logs a warning, so forks/PR pushes do not go red.
name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build + deploy landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-node resolves the package manager for its package-manager
      # cache, so pnpm must be on PATH before it runs (same order as ci.yml).
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # landing/package.json "build" already runs
      # `node scripts/bake-github-release.mjs && astro build`, but the steps
      # are kept separate here so a bake failure never blurs into a build log.
      - name: Bake release download links
        working-directory: landing
        run: node scripts/bake-github-release.mjs

      - name: Build landing
        working-directory: landing
        run: pnpm exec astro build

      # The secrets context is not reliably readable in step-level `if`
      # expressions, so the two secrets are bridged through env vars
      # (empty secret -> '' -> 'false') and surfaced as a job output.
      - name: Check Cloudflare secrets
        id: cf
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_API_TOKEN" = "true" ] && [ "$HAS_ACCOUNT_ID" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare Pages deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          # Project name defaults to 'vyotiq'; override per-repo via the
          # CLOUDFLARE_PAGES_PROJECT repository variable if it differs.
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'vyotiq' }}
