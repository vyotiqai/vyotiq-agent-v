# Deploys the landing site to Cloudflare Pages on every main push that touches it.
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  — token with Cloudflare Pages: Edit permission
#   CLOUDFLARE_ACCOUNT_ID — the Pages account id
name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'scripts/sync-landing-brand.mjs'
      - 'scripts/sync-app-icon.mjs'
      - 'scripts/generate-precision-mono-brand.mjs'
      - 'resources/branding/**'
      - 'resources/icon.png'
      - 'resources/icon.ico'
      - 'src/shared/domain/providers.ts'
      - 'src/shared/ipc/schemas/providers.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm landing:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate the deploy on the same Astro check CI runs, so a type error in the
      # site cannot reach production ahead of CI's verdict.
      - name: Check landing site
        run: pnpm landing:check

      - name: Deploy to Cloudflare Pages
        # Deployed via the wrangler CLI instead of cloudflare/wrangler-action:
        # this repo's Actions policy only allows GitHub-owned actions, so the
        # official action (a third-party action) cannot start here.
        # The Pages project is created on first deploy; the create call fails
        # harmlessly once the project already exists.
        run: |
          pnpm dlx wrangler@4 pages project create vyotiq --production-branch main || echo "[deploy] Pages project vyotiq already exists"
          pnpm dlx wrangler@4 pages deploy landing/dist --project-name=vyotiq --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
