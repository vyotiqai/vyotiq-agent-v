name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build:vite

      - name: Build landing site
        run: pnpm landing:build

      - name: Check landing site
        if: runner.os == 'Linux'
        run: pnpm landing:check

      - name: Audit landing site
        if: runner.os == 'Linux'
        run: pnpm landing:audit

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Package unpacked (smoke)
        run: pnpm exec electron-builder --${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'mac' || 'linux' }} dir --publish never

      - name: GUI e2e
        if: runner.os != 'Linux'
        run: pnpm test:gui-e2e
        env:
          VYOTIQ_E2E_FIXTURE: '1'

      - name: GUI e2e
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:gui-e2e
        env:
          VYOTIQ_E2E_FIXTURE: '1'
