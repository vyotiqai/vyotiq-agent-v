version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # electron-vite 5 peers Vite <= 7; Vite 8 support is only in the
      # electron-vite 6 betas. Move vite, @vitejs/plugin-react and
      # electron-vite together once electron-vite 6 is stable.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # @types/node follows the Node bundled with Electron (44 -> Node 24),
      # not the newest Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The workspace is one directory to Dependabot, so it writes one
      # @types/node version into every manifest: landing's 22.x patch (landing
      # builds on Node 22) arrived as a downgrade of the app's ^24 (#46).
      - dependency-name: '@types/node'
        versions: ['< 24']
      # One Sentry release line: @sentry/electron is pinned exactly, and its
      # declared @sentry/core sets the override in pnpm-workspace.yaml and the
      # @sentry/react version. Dependabot cannot edit the override, so a bump
      # of any one of them mixes two lines; bump all three by hand.
      - dependency-name: '@sentry/electron'
      - dependency-name: '@sentry/react'
      - dependency-name: '@sentry/core'
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
